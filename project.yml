name: ClaudeIsland
options:
  bundleIdPrefix: com.claudeisland
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClaudeIsland:
    type: application
    platform: iOS
    sources:
      - path: ClaudeIsland
      - path: Shared
    info:
      path: Generated/ClaudeIsland-Info.plist
      properties:
        CFBundleDisplayName: Claude Island
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - location
        NSLocationWhenInUseUsageDescription: Only used to keep Claude Island running in the background. Your location is never read or sent anywhere.
        NSLocalNetworkUsageDescription: Claude Island connects to the relay running on your PC to show your Claude Code status.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudeisland.personal
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ClaudeIslandWidget
  ClaudeIslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ClaudeIslandWidget
      - path: Shared
    info:
      path: Generated/ClaudeIslandWidget-Info.plist
      properties:
        CFBundleDisplayName: Claude Island
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudeisland.personal.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
