name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ClaudeIsland.xcodeproj \
            -scheme ClaudeIsland \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -R ClaudeIsland.app Payload/
          zip -qry ClaudeIsland.ipa Payload

      - name: Inspect app bundle
        run: |
          cd build/Build/Products/Release-iphoneos/ClaudeIsland.app
          echo "--- bundle contents"; ls -R . | head -40
          echo "--- app Info.plist"; plutil -p Info.plist
          echo "--- widget Info.plist"; plutil -p PlugIns/ClaudeIslandWidget.appex/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeIsland-ipa
          path: build/Build/Products/Release-iphoneos/ClaudeIsland.ipa

      - name: Publish release (easy download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Build/Products/Release-iphoneos/ClaudeIsland.ipa \
            --title "Latest build" \
            --notes "Unsigned IPA. Sign and install it with Sideloadly."
